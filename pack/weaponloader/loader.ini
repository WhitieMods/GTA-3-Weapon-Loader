; GTA III Weapon Loader configuration
[General]
Enabled=1
LogFile=weaponloader.log
; 1 = create the <spawn> pickups of custom weapons when a NEW game / restart begins.
; (Never done when loading a save: pickups that exist are already stored in that save.)
SpawnPickups=1
; Extra multiplier for custom OGG sounds, applied on top of the game's own SFX volume slider.
AudioVolume=1.0

[Debug]
; Test aids only. They never touch GTA III's weapon-cycling controls.
; F12: create one pickup of EVERY custom weapon in a row at the player's feet, so you can test real pickup collection.
SpawnHereKey=0x7B
; "Instant pickup" keys: <virtual-key-hex>=<weapon id>. 0x75=F6 0x76=F7 0x77=F8 0x78=F9 0x79=F10 0x7A=F11. Delete the lines to disable.
; They run the same replacement code path as a real pickup, without needing a pickup object.
0x75=desert_eagle
0x76=colt_python
0x77=original_pistol
0x78=m4
0x79=ruger_556
0x7A=original_ak47
